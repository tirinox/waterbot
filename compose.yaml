name: waterbot

services:
  waterbot:
    build:
      context: .
    init: true
    restart: unless-stopped
    environment:
      WATERBOT_PORT: "${WATERBOT_PORT:-9421}"
    ports:
      - "${WATERBOT_PORT:-9421}:${WATERBOT_PORT:-9421}"
    volumes:
      - type: bind
        source: ./config.yaml
        target: /app/config.yaml
        read_only: true
      - type: volume
        source: waterbot-data
        target: /data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, socket; socket.create_connection(('127.0.0.1', int(os.environ['WATERBOT_PORT'])), timeout=2).close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 20s

volumes:
  waterbot-data:
