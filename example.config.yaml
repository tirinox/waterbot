# Rename it to config.yaml to use it.

telegram:
  api_token: "<YOUR_BOT_TOKEN_HERE>"
  channel_id: -1001234567890


logic:
  warning_level: 5.0
  critical_level: 2.0

  # Send an alert only after readings remain within this many liters for the
  # whole period. This prevents handling a bottle or a single noisy sample from
  # triggering an immediate notification.
  stability_period: 1m
  stability_tolerance: 0.2
  stability_min_samples: 3

  cd_normal: 1d
  cd_warning: 12h
  cd_critical: 2h


api:
  host: "0.0.0.0"
  port: 9421
  max_request_size_bytes: 16384
  rate_limit_requests: 60
  rate_limit_period_seconds: 60
  min_water_level: 0.0
  max_water_level: 50.0


iot:
  # Firmware posts directly to this complete endpoint URL.
  # Use HTTPS when the endpoint leaves a trusted private network.
  callback_host: "https://waterbot.example.com/sensor"
  wifi_ssid: "<YOUR_WIFI_SSID>"
  wifi_password: "<YOUR_WIFI_PASSWORD>"
  shared_secret: "<GENERATE_A_LONG_RANDOM_SECRET>"
  # Delay in seconds between sensor submissions.
  delay: 5
